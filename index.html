<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- If your deployed URL differs from this, update the og:url and og:image base. -->
    <link rel="canonical" href="https://akshar-patel.vercel.app/" />

    <!-- Primary meta tags -->
    <title>Akshar Patel — AI/ML Engineer</title>
    <meta
      name="description"
      content="Akshar Patel — AI/ML Engineer building LLM agents, RAG pipelines, and production ML systems. MS Data Science @ Indiana University (4.0 GPA)."
    />
    <meta name="author" content="Akshar Patel" />

    <!-- Open Graph (controls link previews when shared on LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://akshar-patel.vercel.app/" />
    <meta property="og:title" content="Akshar Patel — AI/ML Engineer" />
    <meta
      property="og:description"
      content="Building LLM agents, RAG pipelines, and production ML systems. MS Data Science @ Indiana University (4.0 GPA)."
    />
    <meta property="og:image" content="https://akshar-patel.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akshar Patel — AI/ML Engineer" />
    <meta
      name="twitter:description"
      content="Building LLM agents, RAG pipelines, and production ML systems."
    />
    <meta name="twitter:image" content="https://akshar-patel.vercel.app/og-image.jpg" />

    <!-- Set theme class before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark || true;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
